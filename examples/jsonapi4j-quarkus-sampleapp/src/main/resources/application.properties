quarkus.http.port=8080
smallrye.config.mapping.validate-unknown=false

# Logging
quarkus.log.category."pro.api4".level=DEBUG

# JsonApi4j core settings
jsonapi4j.rootPath=/jsonapi

# Meta API
jsonapi4j.meta.enabled=true

# Validation
jsonapi4j.validation.maxNumberFilterParams=5
jsonapi4j.validation.maxElementsInFilterParam=20
jsonapi4j.validation.resourceIdMaxLength=64
jsonapi4j.validation.limitMaxValue=100
jsonapi4j.validation.maxElementsInIncludeParam=10
jsonapi4j.validation.maxElementsInSortByParam=5

# CD Plugin
jsonapi4j.cd.enabled=true
jsonapi4j.cd.maxHops=3
jsonapi4j.cd.maxIncludedResources=100
jsonapi4j.cd.errorStrategy=IGNORE
jsonapi4j.cd.propagation=FIELDS,CUSTOM_QUERY_PARAMS,HEADERS
jsonapi4j.cd.deduplication=DATA_AND_INCLUDED
jsonapi4j.cd.unsupportedIncludes=FAIL
jsonapi4j.cd.httpConnectTimeoutMs=5000
jsonapi4j.cd.httpTotalTimeoutMs=10000
jsonapi4j.cd.cache.enabled=true
jsonapi4j.cd.cache.maxSize=1000
# Settings per resource type. Only a type served by a *different* service needs a 'url'; it gets the client's
# credentials (Authorization, cookies, ...) only with 'propagateCredentials=true'. Same-app types - including the
# built-in meta types (state, plugins, resources, relationships, operations, config) - resolve automatically against
# the endpoint the request arrived on; an entry for one only overrides its filter[id]=... batch size.
jsonapi4j.cd.mapping.users.maxBatchSize=20
jsonapi4j.cd.mapping.countries.maxBatchSize=20
jsonapi4j.cd.mapping.currencies.maxBatchSize=20
#jsonapi4j.cd.mapping.rates.url=https://rates-service.internal/jsonapi
#jsonapi4j.cd.mapping.rates.maxBatchSize=50
#jsonapi4j.cd.mapping.rates.propagateCredentials=true
# Fallback max number of resource IDs per downstream filter[id]=... request, for types without their own.
jsonapi4j.cd.mapping.default.maxBatchSize=20

# AC Plugin
jsonapi4j.ac.enabled=true
# Reject access control that cannot take effect instead of only logging it. Useful in CI.
jsonapi4j.ac.failOnMisconfiguration=false
# What a response says about data withheld from the caller:
# NONE | INDICATOR | FIELDS | FIELDS_AND_REASONS. Off by default - saying that something
# was hidden confirms that something is there.
jsonapi4j.ac.anonymizationReport=NONE

# Sparse Fieldsets Plugin
jsonapi4j.sf.enabled=true
jsonapi4j.sf.requestedFieldsDontExistMode=SPARSE_ALL_FIELDS

# OAS Plugin
jsonapi4j.oas.enabled=true
jsonapi4j.oas.oasRootPath=/jsonapi/oas
jsonapi4j.oas.info.title=JSON:API Users & Countries
jsonapi4j.oas.info.version=1.0.0
jsonapi4j.oas.info.description=JSON:API Users & Countries Quarkus Sample App
jsonapi4j.oas.info.contact.name=John Doe
jsonapi4j.oas.info.contact.url=http://users.foo.bar/john
jsonapi4j.oas.info.contact.email=john.doe@foo.bar
jsonapi4j.oas.info.license.name=Apache 2.0
jsonapi4j.oas.info.license.url=https://www.apache.org/licenses/LICENSE-2.0
jsonapi4j.oas.externalDocumentation.url=http://foo.bar.docs/article-1
jsonapi4j.oas.externalDocumentation.description=Extra documentation description
jsonapi4j.oas.oauth2.clientCredentials.name=Client_Credentials
jsonapi4j.oas.oauth2.clientCredentials.description=Use this grant flow to access non-personalized data.
jsonapi4j.oas.oauth2.clientCredentials.tokenUrl=http://foo.bar/tokenUrl
jsonapi4j.oas.oauth2.authorizationCodeWithPkce.name=Authorization_Code_With_PKCE
jsonapi4j.oas.oauth2.authorizationCodeWithPkce.description=Use this grant flow to access personalized user data.
jsonapi4j.oas.oauth2.authorizationCodeWithPkce.tokenUrl=http://foo.bar/tokenUrl
jsonapi4j.oas.oauth2.authorizationCodeWithPkce.authorizationUrl=http://foo.bar/authorizationUrl
jsonapi4j.oas.oauth2.authorizationCodeWithPkce.scopes[0].name=users.read
jsonapi4j.oas.oauth2.authorizationCodeWithPkce.scopes[0].description=Read-only access to a user data
jsonapi4j.oas.oauth2.authorizationCodeWithPkce.scopes[1].name=users.citizenships.read
jsonapi4j.oas.oauth2.authorizationCodeWithPkce.scopes[1].description=Read a user's citizenships relationship
jsonapi4j.oas.oauth2.authorizationCodeWithPkce.scopes[2].name=users.sensitive.read
jsonapi4j.oas.oauth2.authorizationCodeWithPkce.scopes[2].description=Read a user's sensitive attributes
jsonapi4j.oas.servers[0].name=Localhost
jsonapi4j.oas.servers[0].enabled=true
jsonapi4j.oas.servers[0].url=http://localhost:${quarkus.http.port}
jsonapi4j.oas.servers[1].name=Staging
jsonapi4j.oas.servers[1].enabled=false
jsonapi4j.oas.servers[1].url=https://api.stage.com
jsonapi4j.oas.servers[2].name=Production
jsonapi4j.oas.servers[2].enabled=false
jsonapi4j.oas.servers[2].url=https://api.com
