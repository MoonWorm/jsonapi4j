spring:
  application:
    name: jsonapi4j-springboot-sampleapp

server:
  port: 8080
  tomcat:
    # JSON:API sends filter[...] and fields[...] unencoded; Tomcat rejects raw '[' and ']' by default.
    # Jetty, Undertow and Quarkus accept them as they are and need no equivalent setting.
    relaxed-query-chars: "[,]"

jsonapi4j:
  # JsonApi4j core settings
  rootPath: /jsonapi

  # Meta API
  meta:
    enabled: true

  # CD Plugin
  cd:
    enabled: true
    maxHops: 3
    maxIncludedResources: 100
    errorStrategy: IGNORE
    propagation:
      - FIELDS
      - CUSTOM_QUERY_PARAMS
      - HEADERS
    deduplication: DATA_AND_INCLUDED
    unsupportedIncludes: FAIL
    httpConnectTimeoutMs: 5000
    httpTotalTimeoutMs: 10000
    # Fallback max number of resource IDs per downstream filter[id]=... request.
    # The resolver splits larger ID sets into parallel chunks of this size.
    defaultMaxBatchSize: 20
    cache:
      enabled: true
      maxSize: 1000
    # Settings per resource type. Only a type served by a *different* service needs a 'url'; it gets the client's
    # credentials (Authorization, cookies, ...) only with 'propagateCredentials: true'. Same-app types — including the
    # built-in meta types (state, plugins, resources, relationships, operations, config) — resolve automatically
    # against the endpoint the request arrived on; an entry for one only overrides its filter[id]=... batch size.
    mapping:
      users:
        maxBatchSize: 20
      countries:
        maxBatchSize: 20
      currencies:
        maxBatchSize: 20
      # rates:
      #   url: https://rates-service.internal/jsonapi
      #   maxBatchSize: 50
      #   propagateCredentials: true

  # AC Plugin
  ac:
    enabled: true
    # Reject access control that cannot take effect instead of only logging it. Useful in CI.
    failOnMisconfiguration: false
    # What a response says about data withheld from the caller:
    # NONE | INDICATOR | FIELDS | FIELDS_AND_REASONS. Off by default — saying that something
    # was hidden confirms that something is there.
    anonymizationReport: NONE

  # Sparse Fieldsets Plugin
  sf:
    enabled: true
    requestedFieldsDontExistMode: SPARSE_ALL_FIELDS

  # OAS Plugin
  oas:
    enabled: true
    oasRootPath: /jsonapi/oas
    info:
      title: JSON:API Users & Countries
      version: 1.0.0
      description: JSON:API Users & Countries Spring Boot Sample App
      contact:
        name: John Doe
        url: http://users.foo.bar/john
        email: john.doe@foo.bar
      license:
        name: Apache 2.0
        url: https://www.apache.org/licenses/LICENSE-2.0
    externalDocumentation:
      url: http://foo.bar.docs/article-1
      description: Extra documentation description

    oauth2:
      clientCredentials:
        name: Client_Credentials
        description: Use this grant flow to access non-personalized data.
        tokenUrl: http://foo.bar/tokenUrl
      authorizationCodeWithPkce:
        name: Authorization_Code_With_PKCE
        description: Use this grant flow to access personalized user data.
        tokenUrl: http://foo.bar/tokenUrl
        authorizationUrl: http://foo.bar/authorizationUrl
        scopes:
          - name: users.read
            description: Read-only access to a user data
          - name: users.citizenships.read
            description: Read a user's citizenships relationship
          - name: users.sensitive.read
            description: Read a user's sensitive attributes
    servers:
      - name: Localhost
        enabled: true
        url: http://localhost:${server.port}
      - name: Staging
        enabled: false
        url: https://api.stage.com
      - name: Production
        enabled: false
        url: https://api.com
  # Validation
  validation:
    maxNumberFilterParams: 5
    maxElementsInFilterParam: 20
    resourceIdMaxLength: 64
    limitMaxValue: 100
    maxElementsInIncludeParam: 10
    maxElementsInSortByParam: 5


logging:
  level:
    root: INFO
    pro.api4: DEBUG