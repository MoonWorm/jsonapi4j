name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # The floor JDK, not the newest: --release 17 already rejects a newer API at compile time, so what a
      # build here adds is the half --release cannot see - Lombok, JaCoCo, Mockito, Quarkus augmentation and
      # Jetty all running on 17. It is also the JDK a contributor is least likely to have installed, which
      # makes CI the right place to hold that line. Newer JDKs are covered by the weekly compatibility runs.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build with Maven
        run: mvn -B verify
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: jsonapi4j-report/target/site/jacoco-aggregate/jacoco.xml
          token: ${{ secrets.CODECOV_TOKEN }}
