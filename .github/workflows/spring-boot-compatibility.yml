name: Spring Boot Compatibility

# Runs the one combination the Build matrix cannot: the artifact exactly as it is published - compiled against
# the Spring Boot 3 floor - executing on a Spring Boot 4 runtime. That is what a Boot 4 user actually gets from
# Maven Central, and neither Build axis reproduces it, because each axis recompiles the framework against the
# version it tests.
#
# Pull requests build the Spring Boot 3 baseline only, to keep runner minutes down, so this workflow carries the
# whole Boot 4 promise between releases:
#
#   1. compile-and-test the sources against Boot 4 - catches anything removed or changed in Boot 4;
#   2. run the artifact as published (compiled on the Boot 3 floor) against a Boot 4 runtime - catches the
#      narrower case of a change that is source-compatible but binary incompatible.
#
# The release workflow runs both as hard gates, so a Boot 4 regression can never reach Maven Central; it only
# surfaces later than it would have on the pull request itself.

on:
  workflow_dispatch:
  schedule:
    # Mondays 05:00 UTC, before the weekly Dependabot run so a Spring bump lands against a known-good baseline.
    - cron: '0 5 * * 1'

concurrency:
  group: spring-boot-compatibility
  cancel-in-progress: false

jobs:
  # Walks the supported Boot range rather than only its top end. The floor is the first 3.x release, so most of
  # the range is versions the build never compiles against by default.
  sources-on-boot-version:
    name: Sources on Spring Boot ${{ matrix.spring-boot }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # One failing version must not hide the others - the point is to learn where the range ends.
      fail-fast: false
      matrix:
        include:
          # spring-test is only pulled in transitively from Boot 3.3 onwards, so the test classpath declares it
          # explicitly and its version has to be named alongside each Boot version. Spring does not support
          # mixing Framework module versions.
          - spring-boot: '3.0.0'   # the documented floor
            framework: '6.0.2'
          - spring-boot: '3.2.0'
            framework: '6.1.1'
          - spring-boot: '3.4.2'
            framework: '6.2.2'
          - spring-boot: '4.1.0'   # carried by the profile, which sets both properties itself
            framework: ''

    steps:
      - uses: actions/checkout@v7
      # Held at the floor JDK across every Boot entry so a failure here is attributable to Spring rather than to
      # the JDK. The JDK axis is walked by the Quarkus compatibility workflow.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Verify against Spring Boot ${{ matrix.spring-boot }}
        run: |
          if [ "${{ matrix.spring-boot }}" = "4.1.0" ]; then
            mvn -B clean verify -Pspring-boot-4
          else
            mvn -B clean verify \
              -Dspring.boot.version=${{ matrix.spring-boot }} \
              -Dspring.framework.version=${{ matrix.framework }}
          fi

  published-artifact-on-boot4:
    name: Boot 3 artifact on Boot 4 runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # Builds and installs the framework the way a release does - no profile - so the local repository holds
      # artifacts compiled against Spring Boot 3.
      - name: Install the framework as published (Spring Boot 3 baseline)
        run: mvn -B clean install -DskipTests

      # No -am on purpose: the sample app must resolve jsonapi4j-rest-springboot from the local repository rather
      # than rebuild it, so the jar under test is the one installed above.
      - name: Run the Spring sample app on a Spring Boot 4 runtime
        run: mvn -B -pl examples/jsonapi4j-springboot-sampleapp test -Pspring-boot-4
