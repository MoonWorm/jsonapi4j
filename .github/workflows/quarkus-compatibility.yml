name: Quarkus Compatibility

# The extension is compiled against one Quarkus version but consumers run their own, and Quarkus' build-time
# extension API (BuildStep, BuildItem) moves across minor releases - so "works on the version we pin" says little
# about the versions people actually use. This walks the supported range instead.
#
# Weekly rather than per-PR: each entry is a full reactor build, and the extension changes rarely.

on:
  workflow_dispatch:
  schedule:
    # Mondays 05:30 UTC, after the Spring Boot compatibility run.
    - cron: '30 5 * * 1'

concurrency:
  group: quarkus-compatibility
  cancel-in-progress: false

jobs:
  quarkus:
    name: Quarkus ${{ matrix.quarkus }} on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # One failing version must not hide the others - the point is to learn where the range ends.
      fail-fast: false
      matrix:
        quarkus:
          - '3.20.6'     # LTS - the documented floor, and what the build pins by default
          - '3.33.3.2'   # the current LTS, where most applications sit
          - '3.39.3'     # latest
        # Walked here rather than in a workflow of its own: every entry is already a full reactor build, so
        # the second axis costs nothing extra to set up and makes this the project's recurring check that the
        # JDK 17 floor still runs on current JDKs.
        java: [ 17, 25 ]

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # One property covers the extension and the sample app: the app's quarkus.platform.version follows
      # quarkus.version, so they can never be tested as a mismatched pair.
      #
      # Written into the poms rather than passed as -Dquarkus.version: from Maven 3.10 the quarkus-maven-plugin
      # builds the test app model from the reactor poms without seeing command-line overrides, so the sample app
      # was augmented against the poms' default Quarkus and then run on the matrix one (NoSuchMethodError /
      # AbstractMethodError in io.quarkus.bootstrap). Editing the poms leaves every reader the same version.
      - name: Set Quarkus ${{ matrix.quarkus }}
        run: mvn -B versions:set-property -Dproperty=quarkus.version -DnewVersion=${{ matrix.quarkus }} -DgenerateBackupPoms=false
      - name: Verify against Quarkus ${{ matrix.quarkus }}
        run: mvn -B clean verify
