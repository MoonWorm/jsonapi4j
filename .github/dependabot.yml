# Weekly dependency PRs. Nothing merges automatically — every PR is reviewed by hand.
#
# Minor and patch updates are batched into a single PR per ecosystem to keep review to one pass a week.
# Major updates are deliberately left ungrouped: each one is a compatibility decision for a published
# library, and bundling them would make one risky bump block a batch of safe ones.
#
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # Maven. Directory "/" is enough: Dependabot follows <modules> from the root pom, and every version
  # is declared as a property there anyway.
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
    # Support floors, not "latest" versions. The framework compiles against the OLDEST version it supports,
    # so that reaching for a newer API is a compile error here rather than a runtime failure in someone
    # else's application. Bumping any of these raises the floor silently: the build stays green - compiling
    # against a newer version always is - and only a user still on the old version ever finds out, long
    # after the PR was merged. Minor bumps would also land inside the grouped weekly PR, which is exactly
    # the one that gets skimmed.
    #
    # Raise a floor by hand instead: edit the property, run the matching compatibility workflow to prove the
    # new floor works, and update the table in docs/compatibility.md. See adr/0004-java-17-floor.md.
    #
    # Wildcards cover every artifact these properties feed, in the child poms as well as the root. The Java
    # floor needs no entry - maven.compiler.release is a plain property, not a dependency.
    ignore:
      - dependency-name: "org.springframework.boot:*"   # spring.boot.version - floor 3.0.0
      - dependency-name: "org.springframework:spring-test"  # spring.framework.version - pairs with the above
      - dependency-name: "io.quarkus:*"                 # quarkus.version - floor 3.20.6
      - dependency-name: "io.quarkus.platform:*"        # the sample app's platform BOM follows quarkus.version
      - dependency-name: "jakarta.servlet:jakarta.servlet-api"  # floor 6.0.0
      # slf4j-api is compile-scope in jsonapi4j-core, -base, -compound-docs-resolver and both plugins, so it
      # ships in the published poms and its version is a floor like the integration coordinates above. Every
      # consumer with a BOM overrides it anyway - a Boot 3.4 application resolves slf4j 2.0.16, not this - so a
      # bump buys them nothing. The consumers who do get this version are the BOM-less servlet ones, where
      # slf4j-api 2.x against a 1.7-era binding (logback 1.2.x) does not fail the build: it prints "No SLF4J
      # providers were found" and falls back to a NOP logger, so the application silently stops logging.
      # Staying on 1.7 also keeps the fluent 2.x API (atInfo(), atLevel()) a compile error here.
      - dependency-name: "org.slf4j:slf4j-api"          # floor 1.7.32
      # springdoc tracks the Spring Boot version of the sample app, not semver, so every update to it is a
      # decision about the sample app's Boot version rather than a library bump. Each springdoc release is built
      # on one Boot release - 2.8.8 on Boot 3.4.5, 2.9.1 on Boot 3.5.16 - and the mismatch does not degrade
      # gracefully:
      #
      #   * springdoc 3 on Boot 3 (#187) fails the context with duplicate auto-configuration beans
      #     (conventionErrorViewResolver), because springdoc 3 drags Boot 4 modules onto the classpath;
      #   * springdoc 2.9 on Boot 3.4 (#206) fails the context with PatternParseException while building
      #     resourceHandlerMapping, because its swagger-ui resource pattern needs the newer path parser.
      #
      # The first was a major and the second a minor, which is why this is a blanket ignore rather than one
      # scoped to majors. Move springdoc by hand when spring.boot.version in examples/pom.xml moves, as a pair.
      # There is no security argument for automating it: springdoc is used only by the Spring sample app, never
      # by a published module.
      - dependency-name: "org.springdoc:*"
      # json-unit is test-scope, which normally means it tracks latest - but it binds to Jackson, and Jackson
      # moves with Spring Boot. json-unit 6 reads JsonNodeFeature.STRIP_TRAILING_BIGDECIMAL_ZEROES, added in
      # Jackson 2.15, while the Boot 3.0 floor manages Jackson 2.14.1, so #186 turned the whole floor axis red
      # (NoSuchFieldError in the sample apps, before any assertion ran) while every pull request stayed green.
      # Held on the 2.x line until the Boot floor moves past 3.1.
      - dependency-name: "net.javacrumbs.json-unit:*"   # floor: works with the Jackson the Boot 3.0 BOM ships
    groups:
      maven-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
